# OmenMon Continuous Integration (CI) Workflow
# Stage 1: Unit Tests
# Stage 2: Compile Executable

name: "OmenMon CI"
run-name: "CI Build & Test #${{ github.run_number }} (${{ github.ref_name }})"

on:
  push:
    branches:
      - master
      - main
      - 'release/*'
      # fork working branches (sporqist/OmenMon-Reborn)
      - 'pr/**'
      - 'exp/**'
      - 'modern/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-unit-tests:
    name: "Stage 1: Unit Tests"
    runs-on: windows-2025-vs2026

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up .NET 10 SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: "Run Unit Tests"
        run: |
          dotnet test --project Tests/OmenMon.Tests/OmenMon.Tests.csproj -c Release

  stage2-compile:
    name: "Stage 2: Compile Executable"
    needs: stage1-unit-tests
    runs-on: windows-2025-vs2026

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up .NET 10 SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: "Build Solution with Root OmenMon.xml"
        run: |
          dotnet build OmenMon.sln -c Release --no-incremental

      - name: "Upload CI Artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OmenMon-CI-Binaries
          path: |
            Bin/OmenMon.exe
            Bin/OmenMon.Core.dll
            Bin/OmenMon.xml
          if-no-files-found: error
